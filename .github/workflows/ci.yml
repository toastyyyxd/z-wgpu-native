name: CI

on:
  push:
    branches: [main, zig-0.17.1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-cache.toastyx.dev https://zig2nix.cachix.org
            extra-trusted-public-keys = carbon:jeqyrpj5bvQbe1UuSa/qiK6F5JC+euudPFNk+ZDc830= zig2nix.cachix.org-1:LSXEcFKIAN2NtNsznYLMbhEtyHHorV0caI2UgTIxk2k=
      - name: Allow unprivileged user namespaces
        # zig2nix wraps Zig with bubblewrap; Ubuntu 24.04 restricts unprivileged
        # user namespaces via AppArmor, which breaks its Nix build.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Build and run headless suites
        run: nix build .#default --no-link --print-out-paths
      - name: Push to carbon cache
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          CARBON_CACHE_SSH_KEY: ${{ secrets.CARBON_CACHE_SSH_KEY }}
          CARBON_CACHE_SIGNING_KEY: ${{ secrets.CARBON_CACHE_SIGNING_KEY }}
        run: |
          ./.github/scripts/push-cache.sh "$GITHUB_SHA" \
            "$(nix build .#default --no-link --print-out-paths)" \
            "$(nix build .#devShells.x86_64-linux.default --no-link --print-out-paths)"

  windows-tests:
    name: tests (windows-gnu via Wine)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-cache.toastyx.dev https://zig2nix.cachix.org
            extra-trusted-public-keys = carbon:jeqyrpj5bvQbe1UuSa/qiK6F5JC+euudPFNk+ZDc830= zig2nix.cachix.org-1:LSXEcFKIAN2NtNsznYLMbhEtyHHorV0caI2UgTIxk2k=
      - name: Allow unprivileged user namespaces
        # zig2nix wraps Zig with bubblewrap; Ubuntu 24.04 restricts unprivileged
        # user namespaces via AppArmor, which breaks its Nix build.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Run abi/lib suites under Wine
        run: |
          nix develop .#windows-tests -c zig build test -Dtest=true -Dmode=minimal \
            -Dcore-tests=true -Dforce-cross-tests=true \
            -Dtarget=x86_64-windows-gnu -fwine

  macos-tests:
    name: tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-cache.toastyx.dev https://zig2nix.cachix.org
            extra-trusted-public-keys = carbon:jeqyrpj5bvQbe1UuSa/qiK6F5JC+euudPFNk+ZDc830= zig2nix.cachix.org-1:LSXEcFKIAN2NtNsznYLMbhEtyHHorV0caI2UgTIxk2k=
      - name: Run abi/lib suites natively
        run: nix develop -c zig build test -Dtest=true -Dmode=minimal -Dcore-tests=true
      - name: Push to carbon cache
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          CARBON_CACHE_SSH_KEY: ${{ secrets.CARBON_CACHE_SSH_KEY }}
          CARBON_CACHE_SIGNING_KEY: ${{ secrets.CARBON_CACHE_SIGNING_KEY }}
        run: |
          ./.github/scripts/push-cache.sh "$GITHUB_SHA" \
            "$(nix build .#devShells.aarch64-darwin.default --no-link --print-out-paths)"

  codegen-check:
    name: codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-cache.toastyx.dev https://zig2nix.cachix.org
            extra-trusted-public-keys = carbon:jeqyrpj5bvQbe1UuSa/qiK6F5JC+euudPFNk+ZDc830= zig2nix.cachix.org-1:LSXEcFKIAN2NtNsznYLMbhEtyHHorV0caI2UgTIxk2k=
      - name: Allow unprivileged user namespaces
        # zig2nix wraps Zig with bubblewrap; Ubuntu 24.04 restricts unprivileged
        # user namespaces via AppArmor, which breaks its Nix build.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Regenerate and compare
        run: |
          nix develop -c zig build -Dmode=codegen codegen
          git diff --exit-code -- src/builders.zig src/callbacks.zig src/handles.zig src/root.zig src/types.zig
      - name: Push to carbon cache
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          CARBON_CACHE_SSH_KEY: ${{ secrets.CARBON_CACHE_SSH_KEY }}
          CARBON_CACHE_SIGNING_KEY: ${{ secrets.CARBON_CACHE_SIGNING_KEY }}
        run: |
          ./.github/scripts/push-cache.sh "$GITHUB_SHA" \
            "$(nix build .#devShells.x86_64-linux.default --no-link --print-out-paths)"

  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - aarch64-linux-android
          - arm-linux-android
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-cache.toastyx.dev https://zig2nix.cachix.org
            extra-trusted-public-keys = carbon:jeqyrpj5bvQbe1UuSa/qiK6F5JC+euudPFNk+ZDc830= zig2nix.cachix.org-1:LSXEcFKIAN2NtNsznYLMbhEtyHHorV0caI2UgTIxk2k=
      - name: Allow unprivileged user namespaces
        # zig2nix wraps Zig with bubblewrap; Ubuntu 24.04 restricts unprivileged
        # user namespaces via AppArmor, which breaks its Nix build.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Build ${{ matrix.target }}
        run: |
          set -eu
          out="$(nix build .#${{ matrix.target }} --no-link --print-out-paths)"
          mkdir -p out
          for src in libwgpu_native.a wgpu_native.lib libz_wgpu_native.a z_wgpu_native.lib; do
            if [ -f "$out/lib/$src" ]; then
              base="${src%.*}"
              ext="${src##*.}"
              cp "$out/lib/$src" "out/${base}-${{ matrix.target }}.${ext}"
            fi
          done
          ls -l out/
      - uses: actions/upload-artifact@v7
        with:
          name: libs-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Push to carbon cache
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          CARBON_CACHE_SSH_KEY: ${{ secrets.CARBON_CACHE_SSH_KEY }}
          CARBON_CACHE_SIGNING_KEY: ${{ secrets.CARBON_CACHE_SIGNING_KEY }}
        run: |
          ./.github/scripts/push-cache.sh "$GITHUB_SHA" \
            "$(nix build .#${{ matrix.target }} --no-link --print-out-paths)"
