name: Backfill release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add the per-target archives to
        required: true
        type: string

permissions:
  contents: write

jobs:
  backfill:
    name: split ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download combined archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          mkdir -p src
          gh release download "$TAG" --pattern '*-bindings.tar.gz' --dir src
          ls -lh src/
      - name: Split and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          name="${TAG#v}"
          archive="$(ls src/*-bindings.tar.gz)"
          mkdir -p extract stage dist
          tar -xzf "$archive" -C extract
          dist="$PWD/dist"
          for f in extract/lib/*; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            ext="${base##*.}"
            case "$base" in
              libwgpu_native-*) stem="libwgpu_native" ;;
              wgpu_native-*) stem="wgpu_native" ;;
              libz_wgpu_native-*) stem="libz_wgpu_native" ;;
              z_wgpu_native-*) stem="z_wgpu_native" ;;
              *) continue ;;
            esac
            target="${base#"${stem}"-}"
            target="${target%".${ext}"}"
            # older combined archives label the aarch64 Android target "android"
            if [ "$target" = "android" ]; then target="aarch64-linux-android"; fi
            mkdir -p "stage/$target/lib" "stage/$target/include"
            cp "$f" "stage/$target/lib/${stem}.${ext}"
            cp extract/include/* "stage/$target/include/"
          done
          for dir in stage/*; do
            target="$(basename "$dir")"
            if [[ "$target" == *windows* ]]; then
              (cd "$dir" && zip -qr "$dist/z-wgpu-native-${name}-${target}.zip" .)
            else
              tar -czf "$dist/z-wgpu-native-${name}-${target}.tar.gz" -C "$dir" .
            fi
          done
          (cd "$dist" && sha256sum ./* > SHA256SUMS)
          ls -lh "$dist"
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
