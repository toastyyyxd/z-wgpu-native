name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - android
          - arm-linux-android
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Allow unprivileged user namespaces
        # zig2nix wraps Zig with bubblewrap; Ubuntu 24.04 restricts unprivileged
        # user namespaces via AppArmor, which breaks its Nix build.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Build ${{ matrix.target }}
        run: |
          set -eu
          out="$(nix build .#${{ matrix.target }} --no-link --print-out-paths)"
          mkdir -p out
          for src in libwgpu_native.a wgpu_native.lib libz_wgpu_native.a z_wgpu_native.lib; do
            if [ -f "$out/lib/$src" ]; then
              base="${src%.*}"
              ext="${src##*.}"
              cp "$out/lib/$src" "out/${base}-${{ matrix.target }}.${ext}"
            fi
          done
          ls -l out/
      - uses: actions/upload-artifact@v7
        with:
          name: libs-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          path: stage/lib
          pattern: libs-*
          merge-multiple: true
      - name: Collect tarball
        run: |
          set -eu
          mkdir -p stage/include
          cp vendor/wgpu-native/ffi/wgpu.h stage/include/wgpu.h
          cp vendor/wgpu-native/ffi/webgpu-headers/webgpu.h stage/include/webgpu.h
          tarball="z-wgpu-native-${GITHUB_REF_NAME#v}-bindings.tar.gz"
          tar -czf "$tarball" -C stage .
          ls -lh "$tarball"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="z-wgpu-native-${GITHUB_REF_NAME#v}-bindings.tar.gz"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$tarball" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$tarball" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
