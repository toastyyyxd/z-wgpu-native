name: Release

on:
  push:
    tags:
      - "v*-zig*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - aarch64-linux-android
          - arm-linux-android
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Allow unprivileged user namespaces
        # zig2nix wraps Zig with bubblewrap; Ubuntu 24.04 restricts unprivileged
        # user namespaces via AppArmor, which breaks its Nix build.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Build ${{ matrix.target }}
        run: |
          set -eu
          out="$(nix build .#${{ matrix.target }} --no-link --print-out-paths)"
          mkdir -p out
          for src in libwgpu_native.a wgpu_native.lib libz_wgpu_native.a z_wgpu_native.lib; do
            if [ -f "$out/lib/$src" ]; then
              base="${src%.*}"
              ext="${src##*.}"
              cp "$out/lib/$src" "out/${base}-${{ matrix.target }}.${ext}"
            fi
          done
          ls -l out/
      - uses: actions/upload-artifact@v7
        with:
          name: libs-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: libs-*
      - name: Package per-target archives
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          dist="$PWD/dist"
          mkdir -p "$dist"
          for dir in artifacts/libs-*; do
            target="${dir#artifacts/libs-}"
            mkdir -p "stage/$target/lib" "stage/$target/include"
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              ext="${base##*.}"
              case "$base" in
                libwgpu_native-*) name="libwgpu_native.$ext" ;;
                wgpu_native-*) name="wgpu_native.$ext" ;;
                libz_wgpu_native-*) name="libz_wgpu_native.$ext" ;;
                z_wgpu_native-*) name="z_wgpu_native.$ext" ;;
                *) continue ;;
              esac
              cp "$f" "stage/$target/lib/$name"
            done
            cp vendor/wgpu-native/ffi/wgpu.h "stage/$target/include/wgpu.h"
            cp vendor/wgpu-native/ffi/webgpu-headers/webgpu.h "stage/$target/include/webgpu.h"
            if [[ "$target" == *windows* ]]; then
              (cd "stage/$target" && zip -qr "$dist/z-wgpu-native-${tag}-${target}.zip" .)
            else
              tar -czf "$dist/z-wgpu-native-${tag}-${target}.tar.gz" -C "stage/$target" .
            fi
          done
          mkdir -p combined/lib combined/include
          cp artifacts/libs-*/* combined/lib/
          cp vendor/wgpu-native/ffi/wgpu.h combined/include/wgpu.h
          cp vendor/wgpu-native/ffi/webgpu-headers/webgpu.h combined/include/webgpu.h
          tar -czf "$dist/z-wgpu-native-${tag}-all.tar.gz" -C combined .
          (cd "$dist" && sha256sum ./* > SHA256SUMS)
          ls -lh "$dist"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          flags=()
          if [[ "$tag" == *-dev ]]; then
            flags+=(--latest=false)
          else
            flags+=(--latest)
          fi
          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            flags+=(--notes-start-tag "$prev")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --generate-notes \
              "${flags[@]}"
          fi
